name: CI

on:
  push:
    branches: [master, main, "release/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    strategy:
      matrix:
        go-version: ["1.27"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -timeout 120s

      - name: Test with race detector
        run: go test ./... -count=1 -timeout 120s -race

      - name: Coverage
        run: |
          go test ./... -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    uses: ./.github/workflows/lint-reusable.yml

  nix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check flake
        run: nix flake check -L

  benchmark:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Run benchmarks
        run: go test ./benchmarks/ -bench=. -benchmem -count=1 -timeout 120s

  gowork-off:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Verify build without workspace
        run: GOWORK=off go build ./...
        working-directory: ${{ github.workspace }}

  # The docs-health battery over this repo on every push/PR: the five
  # gates (freshness, audit-all, annotate, routing, cadence) judge the
  # living docs and the docs/status corpus. A red here is the docs
  # ritual coming due (harvest, archive, strike) — fix the docs, never
  # loosen the gate. docs-gates is public and stdlib-only, so a pinned
  # `go run` needs no credentials; bump the tag manually when a new
  # docs-gates release lands (dependabot does not see go run pins).
  dogfood:
    runs-on: ubuntu-latest
    steps:
      # Full history: the annotate gate resolves `done at <hash>` verdicts
      # against the real commit graph — a depth-1 checkout makes every
      # non-HEAD hash unresolvable and the gate false-fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: docs battery
        run: go run github.com/Artmann-Technologies/docs-gates/cmd/docs-gates@v0.3.0 run .
