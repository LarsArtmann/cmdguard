name: CI

on:
  push:
    branches: [master, main, "release/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The badge commit step pushes to master with the workflow token
    # (run 44845752228: default read-only token got a 403 from
    # github-actions[bot]); everything else in this workflow only reads.
    permissions:
      contents: write
    env:
      GOEXPERIMENT: jsonv2
    strategy:
      matrix:
        go-version: ["1.27"]

    steps:
      # Full history: the badge step pushes to master, which needs a real
      # branch under it (depth-1 clones cannot rebase or push cleanly).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -timeout 120s

      - name: Test with race detector
        run: go test ./... -count=1 -timeout 120s -race

      # Fleet-total coverage (owner decision 2026-11-21: the README badge
      # reports ALL 8 workspace modules, not core-only). `./...` never
      # descends into nested modules (each sub-module has its own go.mod),
      # so create the workspace here and pattern every sub-module explicitly
      # in the Coverage step below.
      - name: Create go workspace
        run: go work init . ./flightrecorder ./glamour ./lint ./prompts ./schema ./spinner ./telemetry

      - name: Coverage
        run: |
          go test ./... ./flightrecorder/... ./glamour/... ./lint/... ./prompts/... ./schema/... ./spinner/... ./telemetry/... -count=1 -timeout 300s -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      # The README coverage badge is GENERATED here and committed, so the
      # number can never drift from a measured run (fleet review finding 5:
      # no hand-maintained coverage claims). It measures the FLEET-TOTAL
      # across all 8 workspace modules (see Create go workspace above).
      # Codecov was REMOVED (2026-11-20):
      # the repo is not activated on the Codecov side, so uploads landed on a
      # dead endpoint ("Token required - not valid tokenless upload") and its
      # badge served "unknown" — this committed SVG is the source of truth.
      - name: Generate coverage badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          int_total=${total%%.*}
          if [ "$int_total" -ge 80 ]; then color="#4c1"
          elif [ "$int_total" -ge 60 ]; then color="#dfb317"
          else color="#e05d44"
          fi
          mkdir -p .github/badges
          cat > .github/badges/coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="110" height="20" role="img" aria-label="coverage (all modules): ${total}%">
            <title>coverage (all modules): ${total}%</title>
            <linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
            <clipPath id="r"><rect width="110" height="20" rx="3" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="64" height="20" fill="#555"/>
              <rect x="64" width="46" height="20" fill="${color}"/>
              <rect width="110" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="32" y="14">coverage</text>
              <text x="87" y="14">${total}%</text>
            </g>
          </svg>
          EOF
          # Sanity gate: refuse to commit a malformed or empty badge (the
          # heredoc above interpolates ${total}; a failed awk would emit a
          # broken SVG silently).
          grep -q '<svg' .github/badges/coverage.svg
          grep -qE '>[0-9]+(\.[0-9]+)?%</text>' .github/badges/coverage.svg

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          git config user.name "cmdguard-coverage-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          if git diff --cached --quiet; then
            echo "coverage badge unchanged"
          else
            # Autostash: concurrent steps may leave unrelated working-tree
            # changes; without it `pull --rebase` aborts (exit 128, seen in
            # run 44768346938). Retry once for the push race with other bots.
            git pull --rebase --autostash origin master || \
              { sleep 5 && git pull --rebase --autostash origin master; }
            git add .github/badges/coverage.svg
            git diff --cached --quiet || \
              git commit -m "chore: refresh coverage badge from CI run [skip ci]"
            git push || { sleep 5 && git pull --rebase --autostash origin master && git add .github/badges/coverage.svg && { git diff --cached --quiet || git commit -m "chore: refresh coverage badge from CI run [skip ci]"; } && git push; }
          fi

  lint:
    uses: ./.github/workflows/lint-reusable.yml

  nix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check flake
        run: nix flake check -L

  benchmark:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"

      - name: Run benchmarks
        run: go test ./benchmarks/ -bench=. -benchmem -count=1 -timeout 120s

  gowork-off:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"

      - name: Verify build without workspace
        run: GOWORK=off go build ./...
        working-directory: ${{ github.workspace }}

  # The docs-health battery over this repo on every push/PR: the five
  # gates (freshness, audit-all, annotate, routing, cadence) judge the
  # living docs and the docs/status corpus. A red here is the docs
  # ritual coming due (harvest, archive, strike) — fix the docs, never
  # loosen the gate. docs-gates is public and stdlib-only, so a pinned
  # `go run` needs no credentials; bump the tag manually when a new
  # docs-gates release lands (dependabot does not see go run pins).
  dogfood:
    runs-on: ubuntu-latest
    steps:
      # Full history: the annotate gate resolves `done at <hash>` verdicts
      # against the real commit graph — a depth-1 checkout makes every
      # non-HEAD hash unresolvable and the gate false-fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"

      - name: docs battery
        run: go run github.com/Artmann-Technologies/docs-gates/cmd/docs-gates@v0.3.1 run .

  # Branded-ID gate (BD003): identifier-typed params/returns/fields must use
  # strong ID types or carry a reasoned //brandid-lint:ignore(BD003)
  # directive. Same rules as the local BuildFlow step (tool_options in
  # .buildflow.yml); pinned `go run` needs no credentials. Bump the tag
  # manually when a new linter release lands.
  brandid-lint:
    name: branded-ID gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
      - run: go run github.com/larsartmann/go-branded-id/linter/cmd/brandid-lint@v0.5.1 -rules BD003 .
