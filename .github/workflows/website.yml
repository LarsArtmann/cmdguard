name: Website

on:
  push:
    branches: [master, main]
    paths:
      - website/**
      - .github/workflows/website.yml
  pull_request:
    branches: [master, main]
    paths:
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm install

      - name: npm audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Typecheck
        run: npx astro check

      - name: Build
        run: npm run build

      - name: HTML Validation
        run: npx html-validate --config .htmlvalidate.json "dist/**/*.html"

      - name: Verify import paths contain /v3
        run: |
          ERRORS=""
          for file in $(grep -rl 'github.com/larsartmann/cmdguard' --include='*.md' --include='*.mdx' --include='*.ts' --include='*.astro' README.md website/src/ 2>/dev/null); do
            BAD=$(grep -n 'github.com/larsartmann/cmdguard"[^/]' "$file" 2>/dev/null || true)
            if [ -n "$BAD" ]; then
              ERRORS="$ERRORS\n$file:\n$BAD\n"
            fi
          done
          if [ -n "$ERRORS" ]; then
            echo "::error::Import paths missing /v3 found:$ERRORS"
            exit 1
          fi
          echo "All import paths correctly reference /v3"

      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist/

  deploy-website:
    name: Deploy Website
    needs: build-website
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist/

      - name: Deploy to Firebase Hosting
        working-directory: website
        run: |
          npm install -g firebase-tools
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > "$RUNNER_TEMP/gcp-key.json"
          firebase deploy --only hosting:cmdguard --project lars-software
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
