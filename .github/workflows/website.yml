name: Website

on:
  push:
    branches: [master, main]
    paths:
      - website/**
      - .github/workflows/website.yml
  pull_request:
    branches: [master, main]
    paths:
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: website/package-lock.json

      - run: pnpm install

      - name: pnpm audit
        run: pnpm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Typecheck
        run: pnpm dlx astro check

      - name: Build
        run: pnpm run build

      - name: HTML Validation
        run: pnpm dlx html-validate --config .htmlvalidate.json "dist/**/*.html"

      - name: Verify import paths contain /v3
        working-directory: ${{ github.workspace }}
        run: |
          ERRORS=""
          for file in $(grep -rl 'github.com/larsartmann/cmdguard' --include='*.md' --include='*.mdx' --include='*.ts' --include='*.astro' README.md website/src/ 2>/dev/null); do
            BAD=$(grep -n 'github.com/larsartmann/cmdguard"[^/]' "$file" 2>/dev/null || true)
            if [ -n "$BAD" ]; then
              ERRORS="$ERRORS\n$file:\n$BAD\n"
            fi
          done
          if [ -n "$ERRORS" ]; then
            echo "::error::Import paths missing /v3 found:$ERRORS"
            exit 1
          fi
          echo "All import paths correctly reference /v3"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-dist
          path: website/dist/

  deploy-website:
    name: Deploy Website
    needs: build-website
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-dist
          path: website/dist/

      - name: Deploy to Firebase Hosting
        working-directory: website
        run: |
          pnpm add -g firebase-tools
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > "$RUNNER_TEMP/gcp-key.json"
          firebase deploy --only hosting:cmdguard --project lars-software
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
