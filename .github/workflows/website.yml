name: Website

on:
  push:
    branches: [master, main]
    paths:
      - website/**
      - .github/workflows/website.yml
  pull_request:
    branches: [master, main]
    paths:
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm was never installed here (npm→pnpm migration gap): setup-node
      # only provides node, and the cache key still pointed at the removed
      # package-lock.json. corepack reads packageManager from package.json.
      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install

      - name: pnpm audit
        run: pnpm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Typecheck
        run: pnpm dlx astro check

      - name: Build
        run: pnpm run build

      - name: HTML Validation
        run: pnpm dlx html-validate --config .htmlvalidate.json "dist/**/*.html"

      - name: Verify import paths contain /v3
        working-directory: ${{ github.workspace }}
        run: |
          ERRORS=""
          for file in $(grep -rl 'github.com/larsartmann/cmdguard' --include='*.md' --include='*.mdx' --include='*.ts' --include='*.astro' README.md website/src/ 2>/dev/null); do
            BAD=$(grep -n 'github.com/larsartmann/cmdguard"[^/]' "$file" 2>/dev/null || true)
            if [ -n "$BAD" ]; then
              ERRORS="$ERRORS\n$file:\n$BAD\n"
            fi
          done
          if [ -n "$ERRORS" ]; then
            echo "::error::Import paths missing /v3 found:$ERRORS"
            exit 1
          fi
          echo "All import paths correctly reference /v3"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist/

  deploy-website:
    name: Deploy Website
    needs: build-website
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # The secrets context is not allowed in `if:`; mirror it through job
    # env so the step can skip when the key is not configured yet.
    env:
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The deploy step shells out to pnpm; without corepack this job has
      # no pnpm at all (setup-node ships only node).
      - run: corepack enable

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: website/dist/

      - name: Deploy to Firebase Hosting
        working-directory: website
        # Skip cleanly until the repo has the FIREBASE_SERVICE_ACCOUNT
        # secret: an empty key would only fail the deploy with an auth
        # error instead.
        if: env.HAS_FIREBASE_KEY == 'true'
        run: |
          # pnpm refuses global installs unless its global bin is already
          # on PATH, and $GITHUB_PATH only affects LATER steps - export it
          # inline. pnpm's configured global bin is PNPM_HOME/bin on Linux.
          export PNPM_HOME="$HOME/.local/share/pnpm"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm add -g firebase-tools
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > "$RUNNER_TEMP/gcp-key.json"
          firebase deploy --only hosting:cmdguard --project lars-software
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
