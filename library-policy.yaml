# library-policy.yaml - Project-specific configuration for cmdguard
#
# This file configures the library-policy scanner for the cmdguard project.
# It extends the default policy with project-specific overrides.
#
# Project: cmdguard - CLI Guard Library
# Go Version: 1.26.1

# Extend the default policy
extends: default

# Project-specific overrides
banned_libraries:
  # FALSE POSITIVE: samber/do v1 detection
  # This project uses github.com/samber/do/v2 throughout.
  # The scanner detects "github.com/samber/do" in imports but doesn't
  # distinguish between v1 and v2 properly. All 14 flagged files use v2.
  samber_do_v1:
    enabled: false
    reason: "FALSE POSITIVE - Project uses samber/do/v2 throughout. Scanner doesn't distinguish v2 imports."

  # FALSE POSITIVE: cobra without fang companion
  # This IS a CLI library that wraps cobra. Having cobra imports is expected
  # for library internals. The main entry points (cli.go, guarded_command.go,
  # guard_exec.go) all use fang for execution. Internal implementation files
  # work with cobra commands directly as part of the library's purpose.
  cobra_companion:
    enabled: false
    reason: "FALSE POSITIVE - cmdguard IS a cobra wrapper library. Fang is used at execution layer. Internal files legitimately work with cobra commands."

  # NOT ACTIONABLE YET: encoding/json/v2 migration
  # Go 1.26.1 does not include encoding/json/v2 in the standard library.
  # This rule should be re-enabled when Go 1.27+ is released with json/v2.
  # Current test files use encoding/json which is the correct choice for now.
  encoding_json_v2_replacement:
    enabled: false
    reason: "NOT ACTIONABLE - encoding/json/v2 doesn't exist in Go 1.26.1. Re-enable when Go 1.27+ is available."

# Global settings
settings:
  fail_on_detection: true
  ignore_files:
    - "vendor/**"
    - "*.pb.go"
    - "*_mock.go"
    - "**/generated/**"
  severity: "warning"
