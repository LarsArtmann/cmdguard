version: "2"
run:
  timeout: 5m
  go: "1.26"
  build-tags: []
  modules-download-mode: readonly
  allow-parallel-runners: false
  allow-serial-runners: false
output:
  formats: {}
linters:
  disable-all: true
  enable:
    - asasalint
    - dupl
    - nolintlint
    - testifylint
    - interfacebloat
    - usestdlibvars
    - zerologlint
    - perfsprint
    - whitespace
    - containedctx
    - nonamedreturns
    - dupword
    - contextcheck
    - gocyclo
    - musttag
    - unconvert
    - errorlint
    - predeclared
    - goheader
    - decorder
    - durationcheck
    - rowserrcheck
    - grouper
    - makezero
    - asciicheck
    - godot
    - promlinter
    - bodyclose
    - arangolint
    - importas
    - loggercheck
    - wastedassign
    - spancheck
    - sloglint
    - testableexamples
    - staticcheck
    - nilnesserr
    - sqlclosecheck
    - ginkgolinter
    - dogsled
    - protogetter
    - reassign
    - tagliatelle
    - errchkjson
    - bidichk
    - mirror
    - nakedret
    - canonicalheader
    - goprintffuncname
    - errcheck
    - exhaustive
    - copyloopvar
    - iotamixing
    - prealloc
    - modernize
    - nosprintfhostport
    - unused
    - fatcontext
    - godox
    - tparallel
    - misspell
    - gomodguard
    - nilerr
    - iface
    - gochecksumtype
    - govet
    - gochecknoinits
    - unqueryvet
    - embeddedstructfieldcheck
    - exptostd
    - ineffassign
    - gosec
    - errname
    - gosmopolitan
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - gocyclo
          - gosec
          - dupl
      - path: _test\.go$
        text: "cyclop"
        linters:
          - "cyclop"
      - path: _test\.go$
        text: "cognitive complexity"
        linters:
          - gocognit
      - path: _test\.go$
        text: shadow
        linters:
          - govet
      - path: _test\.go$
        text: Error return value of .+\.Close is not checked
        linters:
          - errcheck
      - text: weak cryptographic primitive
        linters:
          - gosec
      - text: "unused-parameter: parameter .+ seems to be unused"
        linters:
          - revive
      - path: _test\.go$
        text: dot-imports
        linters:
          - revive
      - path: _test\.go$
        linters:
          - errorlint
      - path: _test\.go$
        text: context-as-argument
        linters:
          - revive
      - path: flags_suggest\.go$
        text: prealloc
        linters:
          - prealloc
formatters:
  enable:
    - goimports
    - golines
    - gci
    - gofmt
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/larsartmann/cmdguard)
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/larsartmann/cmdguard
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    - path: _test\.go$
      linters:
        - depguard
        - cyclop
    - path: examples/
      linters:
        - gocognit

linters-settings:
  gocognit:
    min-complexity: 30
