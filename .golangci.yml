version: "2"
run:
  timeout: 5m
  go: 1.26.0
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        Benchmarks:
          allow:
            - $gostd
            - github.com/larsartmann/cmdguard
            - github.com/samber/do/v2
            - github.com/spf13/cobra
          files:
            - "**/benchmarks/**"
          list-mode: lax
        Examples:
          allow:
            - $gostd
            - charm.land/fang/v2
            - github.com/larsartmann/cmdguard
            - github.com/samber/do/v2
            - github.com/spf13/cobra
            - github.com/spf13/pflag
          files:
            - "**/examples/**"
          list-mode: lax
        Integration:
          allow:
            - $gostd
            - github.com/larsartmann/cmdguard
            - github.com/samber/do/v2
            - github.com/spf13/cobra
          files:
            - "**/tests/**"
          list-mode: lax
        Main:
          allow:
            - $gostd
            - charm.land/fang/v2
            - github.com/knadh/koanf
            - github.com/larsartmann/cmdguard
            - github.com/samber/do/v2
            - github.com/spf13/cobra
            - github.com/spf13/pflag
          files:
            - $all
            - "!$test"
            - "!**/examples/**"
            - "!**/benchmarks/**"
            - "!**/tests/**"
          list-mode: strict
        Test:
          allow:
            - $gostd
            - charm.land/fang/v2
            - github.com/knadh/koanf
            - github.com/larsartmann/cmdguard
            - github.com/onsi/ginkgo
            - github.com/onsi/gomega
            - github.com/samber/do/v2
            - github.com/stretchr
            - github.com/spf13/cobra
            - github.com/spf13/pflag
          files:
            - $test
          list-mode: strict
    funlen:
      lines: 80
      statements: 60
    gocognit:
      min-complexity: 35
    nestif:
      min-complexity: 6
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - gocyclo
          - gosec
          - dupl
          - funlen
          - cyclop
          - gocognit
          - nestif
          - gochecknoglobals
          - err113
          - maintidx
          - wrapcheck
      - path: examples/
        linters:
          - funlen
          - cyclop
          - err113
          - mnd
          - wrapcheck
      - path: benchmarks/
        linters:
          - err113
          - wrapcheck
      - path: tests/
        linters:
          - err113
          - wrapcheck
      - path: pkg/cmdguard/v2/flags_parse.go$
        linters:
          - cyclop
      - path: pkg/cmdguard/v2/types_port.go$
        linters:
          - cyclop
      - path: pkg/cmdguard/v2/cli.go$
        linters:
          - cyclop
          - funlen
      - path: pkg/cmdguard/v2/guard_flags.go$
        linters:
          - cyclop
          - nestif
          - funlen
      - path: pkg/cmdguard/
        linters:
          - exhaustruct
      - path: internal/
        linters:
          - exhaustruct
      - path: examples/
        linters:
          - exhaustruct
      - path: benchmarks/
        linters:
          - exhaustruct
      - path: tests/
        linters:
          - exhaustruct
      - text: for loop can be changed to use an integer range
        linters:
          - intrange
      - path: _test\.go$
        text: shadow
        linters:
          - govet
      - path: _test\.go$
        text: Error return value of .+\.Close is not checked
        linters:
          - errcheck
      - text: weak cryptographic primitive
        linters:
          - gosec
      - text: "unused-parameter: parameter .+ seems to be unused"
        linters:
          - revive
      - path: _test\.go$
        text: dot-imports
        linters:
          - revive
      - path: _test\.go$
        linters:
          - errorlint
      - path: _test\.go$
        text: context-as-argument
        linters:
          - revive
      - path: flags_suggest\.go$
        text: prealloc
        linters:
          - prealloc
      - text: result .+ is always nil
        linters:
          - unparam
      - text: ctx is unused
        linters:
          - unparam
      - text: goconst
        linters:
          - goconst
      - text: maintidx
        linters:
          - maintidx
      - path: pkg/
        linters:
          - goconst
      - path: internal/
        linters:
          - goconst
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/larsartmann/cmdguard)
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/larsartmann/cmdguard
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
