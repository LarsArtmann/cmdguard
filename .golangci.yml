version: "2"
run:
  timeout: 5m
  go: "1.26"
  build-tags: []
  modules-download-mode: readonly
  allow-parallel-runners: false
  allow-serial-runners: false
output:
  formats: {}
linters:
  enable:
    - goconst
    - gochecknoglobals
    - gochecksumtype
    - whitespace
    - fatcontext
    - errchkjson
    - mirror
    - gosec
    - asciicheck
    - testableexamples
    - bidichk
    - unused
    - nilerr
    - recvcheck
    - testifylint
    - sqlclosecheck
    - errname
    - nonamedreturns
    - goheader
    - promlinter
    - containedctx
    - musttag
    - asasalint
    - govet
    - intrange
    - revive
    - godox
    - durationcheck
    - contextcheck
    - godot
    - goprintffuncname
    - thelper
    - spancheck
    - reassign
    - nakedret
    - protogetter
    - copyloopvar
    - cyclop
    - wrapcheck
    - nilnesserr
    - gomodguard
    - zerologlint
    - loggercheck
    - staticcheck
    - exptostd
    - paralleltest
    - dupl
    - gosmopolitan
    - predeclared
    - prealloc
    - errorlint
    - exhaustruct
    - funlen
    - gocognit
    - modernize
    - usestdlibvars
    - nolintlint
    - gocritic
    - embeddedstructfieldcheck
    - makezero
    - importas
    - unparam
    - perfsprint
    - noctx
    - sloglint
    - ginkgolinter
    - rowserrcheck
    - gochecknoinits
    - nilnil
    - errcheck
    - maintidx
    - canonicalheader
    - ineffassign
    - dogsled
    - unqueryvet
    - tparallel
    - iotamixing
    - usetesting
    - gocyclo
    - decorder
    - unconvert
    - nestif
    - tagliatelle
    - exhaustive
    - grouper
    - forcetypeassert
    - interfacebloat
    - wastedassign
    - dupword
    - misspell
    - iface
    - nosprintfhostport
    - bodyclose
    - arangolint
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - gocyclo
          - gosec
          - dupl
      - path: _test\.go$
        text: cyclop
        linters:
          - cyclop
      - path: _test\.go$
        text: cognitive complexity
        linters:
          - gocognit
      - path: _test\.go$
        text: shadow
        linters:
          - govet
      - path: _test\.go$
        text: Error return value of .+\.Close is not checked
        linters:
          - errcheck
      - text: weak cryptographic primitive
        linters:
          - gosec
      - text: "unused-parameter: parameter .+ seems to be unused"
        linters:
          - revive
      - path: _test\.go$
        text: dot-imports
        linters:
          - revive
      - path: _test\.go$
        linters:
          - errorlint
      - path: _test\.go$
        text: context-as-argument
        linters:
          - revive
      - path: flags_suggest\.go$
        text: prealloc
        linters:
          - prealloc
      - text: result .+ is always nil
        linters:
          - unparam
      - text: ctx is unused
        linters:
          - unparam
      - text: goconst
        linters:
          - goconst
      - text: maintidx
        linters:
          - maintidx
      - path: pkg/
        linters:
          - goconst
      - path: internal/
        linters:
          - paralleltest
          - goconst
formatters:
  enable:
    - goimports
    - golines
    - gci
    - gofmt
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/larsartmann/cmdguard)
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/larsartmann/cmdguard
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
