version: "2"
run:
  timeout: 5m
  go: "1.26"
  build-tags: []
  modules-download-mode: readonly
  allow-parallel-runners: false
  allow-serial-runners: false
output:
  formats: {}
linters:
  enable:
    - gosmopolitan
    - gochecknoinits
    - nlreturn
    - godoclint
    - testableexamples
    - wastedassign
    - unused
    - staticcheck
    - gomoddirectives
    - err113
    - rowserrcheck
    - iface
    - testpackage
    - unconvert
    - errorlint
    - nestif
    - maintidx
    - bidichk
    - nilnesserr
    - paralleltest
    - ginkgolinter
    - nakedret
    - perfsprint
    - unqueryvet
    - whitespace
    - usetesting
    - copyloopvar
    - unparam
    - bodyclose
    - gocheckcompilerdirectives
    - dogsled
    - noinlineerr
    - fatcontext
    - embeddedstructfieldcheck
    - iotamixing
    - gocritic
    - grouper
    - sqlclosecheck
    - asasalint
    - exhaustruct
    - canonicalheader
    - testifylint
    - prealloc
    - mirror
    - protogetter
    - arangolint
    - godox
    - exptostd
    - thelper
    - gocognit
    - ineffassign
    - varnamelen
    - wrapcheck
    - gochecksumtype
    - importas
    - gosec
    - recvcheck
    - funcorder
    - goprintffuncname
    - mnd
    - inamedparam
    - makezero
    - goconst
    - containedctx
    - interfacebloat
    - spancheck
    - predeclared
    - wsl_v5
    - reassign
    - dupl
    - usestdlibvars
    - errname
    - tagalign
    - nilnil
    - ireturn
    - tparallel
    - gochecknoglobals
    - tagliatelle
    - modernize
    - nosprintfhostport
    - errcheck
    - misspell
    - forcetypeassert
    - goheader
    - intrange
    - nolintlint
    - gomodguard
    - govet
    - asciicheck
    - decorder
    - godot
    - nonamedreturns
    - dupword
    - gocyclo
    - depguard
    - funlen
    - contextcheck
    - exhaustive
    - zerologlint
    - revive
    - promlinter
    - cyclop
    - forbidigo
    - durationcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - gocyclo
          - gosec
          - dupl
      - path: _test\.go$
        text: shadow
        linters:
          - govet
      - path: _test\.go$
        text: Error return value of .+\.Close is not checked
        linters:
          - errcheck
      - text: weak cryptographic primitive
        linters:
          - gosec
      - text: "unused-parameter: parameter .+ seems to be unused"
        linters:
          - revive
      - path: _test\.go$
        text: dot-imports
        linters:
          - revive
      - path: _test\.go$
        linters:
          - errorlint
      - path: _test\.go$
        text: context-as-argument
        linters:
          - revive
      - path: flags_suggest\.go$
        text: prealloc
        linters:
          - prealloc
formatters:
  enable:
    - gci
    - gofmt
    - goimports
    - golines
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/larsartmann/cmdguard)
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/larsartmann/cmdguard
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
